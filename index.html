<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#EF4444" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CoinWorld" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Coin World / Mundo Moneda</title>
    <meta name="description" content="Coin World — Learn to save money through fun lessons and mini-games. For kids and families." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" /></noscript>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body, #root {
        margin: 0; padding: 0;
        height: 100%; width: 100%;
        -webkit-font-smoothing: antialiased;
        overscroll-behavior: none;
      }
      body {
        background: #1F1108;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="app-shell" style="
      position:fixed; inset:0;
      background:#FFFBEB;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      font-family:Fredoka,sans-serif;
    ">
      <div style="font-size:48px">🪙</div>
      <div style="font-size:20px;font-weight:700;
        color:#1F1108;margin-top:12px">
        Coin World
      </div>
      <div style="width:48px;height:4px;background:#EF4444;
        border-radius:2px;margin-top:16px;
        animation:pulse 1s ease-in-out infinite alternate">
      </div>
    </div>
    <style>
      @keyframes pulse{to{opacity:.3}}
      #root:not(:empty) + #app-shell,
      #root:not(:empty) ~ #app-shell,
      #app-shell:has(~ #root:not(:empty)){display:none}
    </style>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
